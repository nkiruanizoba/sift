[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sift"
version = "0.1.0"
description = "Agentic insights engine: natural-language questions over messy text, answered with citations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nkiru Anizoba" }]
dependencies = [
  "duckdb>=1.0",
  "requests>=2.31",
  "tomli>=2.0; python_version < '3.11'",
  "scikit-learn>=1.3",
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
