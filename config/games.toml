# Games for the Steam player feedback dataset.
#
# Rules: public data only, and no Activision, Blizzard, King, or Microsoft titles.
# App IDs are checked against the Steam store by `python -m sift verify`.
#
# major_patches: fill these in on Day 1 from `python -m sift patches --game <appid>`.
# Use the date the update went live (UTC, YYYY-MM-DD) and a short label.
# Reviews are pulled from days_before to days_after around each patch, split
# evenly under max_reviews. With no patches listed, the most recent reviews are pulled.
#
# Example:
#   major_patches = [
#     { date = "2025-01-15", label = "Update 1.2" },
#   ]

[defaults]
max_reviews = 10000
days_before = 30
days_after = 30

[[games]]
appid = 553850
name = "Helldivers 2"
days_before = 21
days_after = 21
major_patches = [
  { date = "2024-05-03", label = "Account Linking Update" },
  { date = "2024-08-06", label = "Escalation of Freedom (1.001.002)" },
  { date = "2024-09-17", label = "Patch 1.001.100" },
]

